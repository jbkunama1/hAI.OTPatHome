version: "3.8"

services:
  2fauth:
    image: 2fauth/2fauth:latest
    container_name: 2fauth
    restart: unless-stopped

    ports:
      # extern:4444 -> container:8000
      - "4444:8000"

    volumes:
      - /opt/docker/2fauth:/2fauth

    environment:
      # ⚠️ Werte idealerweise NICHT im Repo lassen – in Portainer als ENV-Variablen setzen!
      APP_NAME: "2FAuth"
      APP_ENV: "production"
      APP_DEBUG: "false"

      # ✅ APP_URL: deine echte IP oder Domain (kein Trailing-Slash!)
      # Beispiel LAN:    http://192.168.178.10:4444
      # Beispiel Domain: https://otp.deinedomain.de
      APP_URL: "http://DEINE-IP-ODER-DOMAIN:4444"

      # 🔑 APP_KEY: MUSS mit "base64:" beginnen!
      # Generieren mit: docker exec -it 2fauth php artisan key:generate --show
      APP_KEY: "base64:DEIN_APP_KEY_HIER"

      APP_TIMEZONE: "Europe/Berlin"

      DB_CONNECTION: "sqlite"
      # ✅ Korrekter Pfad: Unterordner /database/ im Volume!
      # Auf dem Host: /opt/docker/2fauth/database/database.sqlite
      DB_DATABASE: "/2fauth/database/database.sqlite"
